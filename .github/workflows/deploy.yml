# Version 1.0
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Dateien für den Upload vorbereiten
        run: |
          mkdir -p deploy
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='.gitignore' \
            --exclude='*.md' \
            --exclude='*.sql' \
            --exclude='*.xlsx' \
            --exclude='*.csv' \
            --exclude='*.zip' \
            --exclude='config.php' \
            --exclude='db.php' \
            --exclude='config.local.php' \
            --exclude='uploads' \
            ./ deploy/

      - name: Per SCP hochladen
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/*"
          target: "public_html"
          strip_components: 1
