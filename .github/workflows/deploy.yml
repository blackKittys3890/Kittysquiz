# Version 1.2
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Dateien für den Upload vorbereiten
        run: |
          mkdir -p deploy
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='.gitignore' \
            --exclude='*.md' \
            --exclude='*.sql' \
            --exclude='*.xlsx' \
            --exclude='*.csv' \
            --exclude='*.zip' \
            --exclude='config.php' \
            --exclude='db.php' \
            --exclude='config.local.php' \
            --exclude='uploads' \
            ./ deploy/

      - name: Ordner anlegen und Dateien hochladen
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          # Schlüssel nur für diesen Lauf ablegen
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Batch-Datei: zuerst alle Ordner (fehlende werden angelegt, vorhandene ignoriert), dann alle Dateien
          cd deploy
          {
            find . -mindepth 1 -type d | sed 's|^\./|-mkdir public_html/|'
            find . -type f | sed 's|^\./||' | while IFS= read -r f; do
              printf 'put "%s" "public_html/%s"\n' "$f" "$f"
            done
          } > ../batch.txt

          echo "Anzahl Befehle: $(wc -l < ../batch.txt)"

          # sftp-Verbindung über denselben Schlüssel (kein Shell-Zugriff nötig)
          sftp -b ../batch.txt \
            -i ~/.ssh/deploy_key \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST"
# Version 1.2