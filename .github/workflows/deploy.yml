# Version 1.1
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Dateien für den Upload vorbereiten
        run: |
          mkdir -p deploy
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='.gitignore' \
            --exclude='*.md' \
            --exclude='*.sql' \
            --exclude='*.xlsx' \
            --exclude='*.csv' \
            --exclude='*.zip' \
            --exclude='config.php' \
            --exclude='db.php' \
            --exclude='config.local.php' \
            --exclude='uploads' \
            ./ deploy/

      - name: Per SFTP hochladen
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USER }}
          server: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          ssh_private_key: ${{ secrets.SSH_KEY }}
          local_path: "./deploy/*"
          remote_path: "public_html"
          sftp_only: true
